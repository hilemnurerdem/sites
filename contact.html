    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <section class="contact-section">
            <h1>Contact Me</h1>
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <p>hilemerdm7@gmail.com</p>
                </div>
                <div class="contact-item">
                    <i class="fas fa-phone"></i>
                    <p>+90 (505) 421 48 04</p>
                </div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/hilem-nur-erdem-475bb0227/" target="_blank" class="social-link">
                        <i class="fab fa-linkedin"></i>
                        LinkedIn
                    </a>
                    <a href="https://github.com/hilemnurerdem" target="_blank" class="social-link">
                        <i class="fab fa-github"></i>
                        GitHub
                    </a>
                    <a href="https://www.instagram.com/hilemnur_/" target="_blank" class="social-link">
                        <i class="fab fa-instagram"></i>
                        Instagram
                    </a>
                </div>
            </div>
        </section>

        <section class="contact-form-section">
            <div class="form-container">
                <h2>Send Message</h2>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Your Email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="Subject" required>
                    </div>
                    <div class="form-group">
                        <textarea placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>

    </footer>

    <script src="js/main.js"></script>
