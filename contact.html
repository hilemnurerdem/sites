<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Blog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <section class="contact-section">
            <h1>Contact Me</h1>
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <p>hilemerdm7@gmail.com</p>
                </div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/hilem-nur-erdem-475bb0227/" target="_blank" class="social-link">
                        <i class="fab fa-linkedin"></i>
                        LinkedIn
                    </a>
                    <a href="https://github.com/hilemnurerdem" target="_blank" class="social-link">
                        <i class="fab fa-github"></i>
                        GitHub
                    </a>
                    <a href="https://www.instagram.com/hilemnur_/" target="_blank" class="social-link">
                        <i class="fab fa-instagram"></i>
                        Instagram
                    </a>
                </div>
            </div>
        </section>

        <section class="contact-form-section">
            <div class="form-container">
                <h2>Send Message</h2>
                <form id="contact-form">
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" placeholder="Your Name" required id="name" maxlength="50" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Your Email" required id="email" maxlength="50" autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="Subject" required id="subject" maxlength="20" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <textarea placeholder="Your Message" required id="message" maxlength="250" oninput="updateCharCount(); filterMessageInput();" autocomplete="off"></textarea>
                        <div id="char-count" style="text-align:right; font-size:12px; color:#888; margin-top:2px;">250 characters left</div>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                    <div id="form-status" style="margin-top: 15px; text-align: center; display: none;"></div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Hilem Nur Erdem. All rights reserved.</p>
    </footer>

    <script>
        (function() {
            emailjs.init("viWvdMa93dr-qJgY_");
        })();

        document.getElementById('contact-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formStatus = document.getElementById('form-status');
            const submitButton = document.querySelector('.submit-btn');
            
            // Get form data
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            // Kod benzeri karakter ve kelimeler için kontrol (daha kapsamlı)
            const forbiddenPattern = /[<>{};\[\]\(\)\/=\*\'\"`]|(function|script|php|class|public|private|def|console\.log|alert|var|let|const|import|export|include|require)/i;
            if (forbiddenPattern.test(name) || forbiddenPattern.test(subject) || forbiddenPattern.test(message)) {
                formStatus.style.display = 'block';
                formStatus.style.color = '#dc3545';
                formStatus.innerHTML = 'Lütfen mesaj alanına sadece metin ve temel noktalama işaretleri giriniz!';
                setTimeout(() => { formStatus.style.display = 'none'; }, 5000);
                return false;
            }

            try {
                // Disable submit button while processing
                submitButton.disabled = true;
                submitButton.textContent = 'Sending...';
                
                // Send email using EmailJS
                const response = await emailjs.send(
                    "service_dwqentj",
                    "template_j7b9x8b",
                    {
                        from_name: name,
                        from_email: email,
                        subject: subject,
                        message: message,
                        reply_to: email
                    }
                );

                if (response.status === 200) {
                    // Show success message
                    formStatus.style.display = 'block';
                    formStatus.style.color = '#28a745';
                    formStatus.innerHTML = 'Mesajınız gönderildi!';
                    this.reset();
                } else {
                    throw new Error('Failed to send message');
                }
                
            } catch (error) {
                // Show error message
                formStatus.style.display = 'block';
                formStatus.style.color = '#dc3545';
                formStatus.innerHTML = 'Mesaj gönderilemedi. Lütfen tekrar deneyin.';
            } finally {
                // Re-enable submit button
                submitButton.disabled = false;
                submitButton.textContent = 'Send Message';
                setTimeout(() => {
                    formStatus.style.display = 'none';
                }, 5000);
            }
        });

        function updateCharCount() {
            const message = document.getElementById('message');
            const charCount = document.getElementById('char-count');
            const max = 250;
            const left = max - message.value.length;
            charCount.textContent = left + ' characters left';
        }
        document.getElementById('message').addEventListener('input', updateCharCount);

        // Sadece metin karakterlerine izin veren fonksiyon
        function filterMessageInput() {
            const message = document.getElementById('message');
            // Sadece harf, rakam, Türkçe karakterler, boşluk ve temel noktalama işaretleri
            const allowed = /[^a-zA-Z0-9ğüşöçıİĞÜŞÖÇ .,!?\-\n]/g;
            if (allowed.test(message.value)) {
                message.value = message.value.replace(allowed, '');
            }
        }
    </script>
</body>
</html>
