<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hilem Nur Erdem</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.07);
            padding: 32px 28px 24px 28px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #1a4b8c;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-form input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d0d7de;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .login-form input:focus {
            border: 1.5px solid #1a4b8c;
        }
        .login-form button {
            margin-top: 10px;
            padding: 10px 0;
            border-radius: 8px;
            background: #1a4b8c;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-form button:hover {
            background: #163a6b;
        }
        .login-error {
            color: #dc3545;
            text-align: center;
            margin-top: 10px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-links nav-left">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="projects.html"><i class="fas fa-code"></i> Projects</a></li>
                <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
                <li><a href="about.html"><i class="fas fa-user"></i> About</a></li>
            </ul>
            <div class="nav-actions">
                <a href="register.html" class="btn btn-register">Register</a>
                <a href="login.html" class="btn btn-login">Login</a>
            </div>
        </div>
    </nav>
    <main>
        <div class="login-container">
            <h2>Login</h2>
            <form class="login-form" id="loginForm">
                <input type="email" placeholder="Email Address" name="email" id="email" required>
                <input type="password" placeholder="Password" name="password" id="password" required>
                <button type="submit">Login</button>
                <div class="login-error" id="loginError" style="display:none;"></div>
            </form>
        </div>
    </main>
    <script>
    // Simulate user data in localStorage (for demo)
    // Registration page should save: localStorage.setItem('user', JSON.stringify({name, email, password}))
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            errorDiv.textContent = 'Please register first!';
            errorDiv.style.display = 'block';
            return;
        }
        const user = JSON.parse(userStr);
        if (user.email === email && user.password === password) {
            sessionStorage.setItem('loggedIn', 'true');
            sessionStorage.setItem('loggedInName', user.name || user.first_name || '');
            window.location.href = 'index.html';
        } else {
            errorDiv.textContent = 'Incorrect email or password!';
            errorDiv.style.display = 'block';
        }
    });
    </script>
</body>
</html>
